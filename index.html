<!DOCTYPE html>
<html>
<head>
    <title>Todo Timer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" type="image/x-icon" href="alarm-clock.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Anton+SC&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Anton SC', sans-serif;
        }
    </style>  
</head>
<body>
    <div class="container">
      <div class="content clockbox">
        <div class="timer">
            <div class="mask"></div>
            00:00:00</div>
            <div class="set-timer">
                <button class="button add-time" data-time="3600">+ 1 Hour</button>
                <button class="button add-time" data-time="1800">+ 30 Min</button>
                <button class="button add-time" data-time="300">+ 5 Min</button>
            </div>

        <div class="interactbuttons">
            <button class="button">Start</button>
            <button class="button">Reset Timer</button>
            <button class="button" id="clear-tasks" >Remove All Task</button>
            <button class="button" id="remove-task">Delete Completed Tasks</button>
            
        </div>
        
      </div>
      
      <div class="content taskbox">
        <h2 class="heading taskcount"></h2>
        <div class="tasklist"></div>
      </div>

      <div class="status content">
        <h2 class="heading">NOTEPAD</h2>
        <div class="notepad" contenteditable="true" spellcheck="false" placeholder="Type Here ..."></div>
        <div class="notepad-buttons">
            <button class="button save-notepad">Save</button>
            
            <button class="button fullscreen-notepad" id="fullscreen-notepad">
                <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke="white" fill="white" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                </svg>
            </button>
            
            <button class="button close-fullscreen-notepad" id="close-fullscreen-notepad" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 9V4.5M15 9H4.5M15 9l5.25-5.25M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M9 9h4.5M9 9V4.5M9 9l-5.25 5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25" />
                </svg>
            </button>
            
        </div>
    
    
        
    </div>
  
    
      
    <div class="smallcontent">
        
        <div class="taskform">
            <h2>Create Task</h2>
            <div class="form-control">
              <input class="input input-alt" placeholder="Enter Your Task Here" required="" type="text">
              <span class="input-border input-border-alt"></span>
            </div>
            <button class="addtask" id="addtask">Create</button>
            
        </div>

        
      
      <div class=" datetime taskform">
       <div class="day">Monday</div>  
       <div class="date">20th July 2024</div>  
       <div class="time">24:00:00</div>  
      </div>

      <div class="web-shortcuts">
        <a href="https://chat.openai.com/" target="_blank">
            <button class="weblink button chatgpt">CHATGPT</button>
        </a>
        <a href="https://www.youtube.com/" target="_blank">
            <button class="weblink button youtube"></button>
        </a>
        <a href="https://www.google.com/" target="_blank">
            <button class="weblink button google"></button>
        </a>
        <a href="https://www.spotify.com/" target="_blank">
            <button class="weblink button spotify"></button>
        </a>
      </div>
    
      
     
    </div>

    

    <script src="script.js"></script>
</body>
</html>
